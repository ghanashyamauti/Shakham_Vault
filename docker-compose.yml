services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shakham-vault-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shakham-vault-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
